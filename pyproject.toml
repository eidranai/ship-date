[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-date"
version = "0.1.0"
description = "Pull new ship dates and delay signals out of vendor email replies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["python-dateutil>=2.8"]
authors = [{name = "Eidran", email = "max@eidran.com"}]

[project.urls]
Homepage = "https://eidran.com"
Source = "https://github.com/eidranai/ship-date"

[tool.setuptools.packages.find]
where = ["src"]
